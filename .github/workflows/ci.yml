name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Verify Social Mirror evidence contract
      run: |
        python -m unittest discover -s tests -p 'test_*.py'
        grep -q "is_public boolean not null default false" supabase/migrations/20260813_social_observations.sql
        grep -q "summary_derived" supabase/migrations/20260813_social_observations.sql
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Build KafLog Reader
      working-directory: frontend/reader
      run: |
        npm install --no-audit --no-fund
        npm run build
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev
    - name: Rustfmt
      run: cargo fmt -- --check
    - name: Clippy
      run: cargo clippy -- -D warnings -A clippy::unwrap_used
    - name: Run tests
      run: cargo test --verbose
